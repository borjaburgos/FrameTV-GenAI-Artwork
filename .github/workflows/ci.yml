name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dagger:
    name: Dagger (Cloud)
    # Repository writers and the owner's same-repository PRs are trusted.
    # Forks and other PRs must never receive an OIDC-capable job.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == github.repository_owner &&
       github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run all Dagger checks on Cloud Engines
        env:
          DAGGER_ENGINE: cloud
          DAGGER_CLOUD_TOKEN: oidc
        run: python3 scripts/ci_github.py

  untrusted:
    name: Dagger (local)
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.head.repo.full_name != github.repository ||
       github.event.pull_request.user.login != github.repository_owner ||
       github.actor != github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run all Dagger checks without Cloud credentials
        env:
          DAGGER_ENGINE: image://registry.dagger.io/engine:v1.0.0-beta.27
          DAGGER_CLOUD_TOKEN: ""
          DAGGER_CHECK_PARALLEL: "2"
        run: python3 scripts/ci_github.py
