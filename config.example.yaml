# FrameArt configuration example
# Copy to config.yaml and edit to match your environment.

# Where artifacts, logs, and secrets are stored
data_dir: /data/frameart

# Default image generation provider: openai | ollama | google (or gemini alias)
default_provider: openai
# default_model: dall-e-3  # provider-specific model ID

# Default upscaler: none | local_http | remote_http
default_upscaler: none

# Logging
log_level: INFO
# log_file: /data/frameart/logs/frameart.log

# Pipeline defaults
# default_style: abstract
auto_aspect_hint: true

# HTTP API security. Required when serving beyond localhost. Admin tokens can
# manage/delete; automation tokens can read, generate, upload, and display.
auth_enabled: true
# admin_token: "replace-with-a-long-random-token"
# automation_token: "optional-separate-token-for-home-automation"
api_rate_limit_per_minute: 60

# Durable browser sessions are created automatically after a successful token
# login and can be paired/revoked from Settings > Access & Paired Devices.
device_session_days: 365
pairing_code_minutes: 10

# Passwordless tailnet access through `tailscale serve`. This is accepted only
# when `frameart serve` binds to loopback. Leave the allowlist empty to accept
# every Tailscale identity that your tailnet policy permits to reach the host.
tailscale_auth_enabled: false
# tailscale_allowed_users:
#   - owner@example.com

# Optional no-prompt access for explicitly trusted RFC1918 subnets. Prefer
# device pairing unless every device on the subnet is trusted.
# trusted_lan_cidrs:
#   - 192.168.1.0/24

# --- TV profiles -------------------------------------------------------------
tvs:
  livingroom_frame:
    ip: "192.168.1.100"
    port: 8002
    name: "FrameArt"
    # token_file: /data/frameart/secrets/livingroom.token
    ssl: true
  # bedroom_frame:
  #   ip: "192.168.1.101"

# --- Provider configurations -------------------------------------------------
providers:
  openai:
    # api_key is read from OPENAI_API_KEY env var (preferred) or set here
    # api_key: "sk-..."
    model: "dall-e-3"
    timeout: 120
  ollama:
    base_url: "http://localhost:11434"
    model: "sdxl"
    timeout: 300
  # google:
  #   api_key: "..."
  #   # base_url: "https://generativelanguage.googleapis.com/v1beta"
  #   model: "gemini-2.5-flash-image-preview"
  #   # optional: expose multiple selectable models in web UI
  #   extra:
  #     models:
  #       - "gemini-2.5-flash-image-preview"
  #       - "nano-banana"
  #       - "nano-banana-2"

# --- Upscaler configurations ------------------------------------------------
upscalers:
  local_http:
    base_url: "http://localhost:7860"
    timeout: 120
  # remote_http:
  #   base_url: "https://api.example.com/upscale"
  #   api_key: "..."
