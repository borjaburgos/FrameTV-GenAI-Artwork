[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frameart"
version = "0.1.0"
description = "Generate AI artwork and display it on Samsung Frame TVs"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1,<9",
    "Pillow>=10.0,<13",
    "httpx2>=2.10,<3",
    "websocket-client>=1.7,<2",
    "samsungtvws>=3.0.4,<4",
    "pyyaml>=6.0,<7",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "qrcode>=8.0,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pytest-cov>=7.0,<8",
    "ruff>=0.16,<1",
]
api = [
    "fastapi>=0.141,<1",
    "python-multipart>=0.0.9,<1",
    "uvicorn[standard]>=0.29,<1",
]
integrations = [
    "paho-mqtt>=2.1,<3",
]

[project.scripts]
frameart = "frameart.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
