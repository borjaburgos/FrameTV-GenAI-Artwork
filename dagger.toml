# Dagger workspace configuration
# Install modules with: dagger module install <module>
# Example:
#   dagger module install dagger.io/linux/wolfi

ignore = [
  ".git", ".agents", ".codex", ".dagger/bin", "dagger-ci-artifacts",
  "**/.env", "**/config.yaml", "**/credentials.toml", "**/*.token",
  "secrets", "data", ".e2e-data", "node_modules", "playwright-report",
  "test-results", "**/.venv", "**/__pycache__", ".pytest_cache", ".ruff_cache",
]

[modules]

[modules.python-sdk]
source = "dagger.io/sdk/python@v1.8.0"

[sdks.python]
module = "python-sdk"

[modules.frameart-ci]
source = ".dagger/modules/frameart-ci"

[sdks.python.scopes.".dagger/modules/frameart-ci"]
is-module = true
name = "frameart-ci"

[sdks.python.scopes.".dagger/modules/frameart-ci".settings]
pythonVersion = "3.12"
template = "empty"
